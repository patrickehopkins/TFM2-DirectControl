[package]
name = "tfm2_direct_control"
version = "0.1.5"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Diagnostic-only native hook. Never enable for Workshop packaging.
replay-native-trace = []

[dependencies]
mod-api-stable = { path = "sdk/mod-api-stable" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
